strategy: few_shot_3
description: Few-shot strategy with 3 short exemplars.

system_prompt: |
  You are a medical expert. Study the examples, then answer the new question.
  Reply with ONLY the letter (A, B, C, or D) of the correct answer.

few_shot_examples:
  - question: "A 55-year-old man presents with chest pain radiating to the left arm..."
    options:
      A: "Stable angina"
      B: "Myocardial infarction"
      C: "Pericarditis"
      D: "Costochondritis"
    answer: "B"
  - question: "A 32-year-old woman with a history of autoimmune thyroid disease presents with fatigue..."
    options:
      A: "Graves disease"
      B: "Subacute thyroiditis"
      C: "Hashimoto thyroiditis"
      D: "Toxic multinodular goiter"
    answer: "C"
  - question: "An infant born at 36 weeks develops respiratory distress shortly after birth..."
    options:
      A: "Respiratory distress syndrome"
      B: "Bronchiolitis"
      C: "Cystic fibrosis"
      D: "Meconium aspiration"
    answer: "A"

user_template: |
  Now answer this question:
  {question}
  A) {option_a}
  B) {option_b}
  C) {option_c}
  D) {option_d}
  Answer:

temperature: 0.0
max_tokens: 4000
top_p: 1.0

